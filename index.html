<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Goat Fin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#6366f1', // Indigo 500
            secondary: '#a5b4fc', // Indigo 300
            accent: '#10b981', // Emerald 500
            danger: '#ef4444', // Red 500
            warning: '#f59e0b', // Amber 500
            background: '#f8fafc', // Slate 50
            surface: '#ffffff',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }

    /* Custom scrollbar for cleaner look */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    /* Animations for AI Chat */
    @keyframes fade-in {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bounce-in {
      0% {
        opacity: 0;
        transform: scale(0.9);
      }
      50% {
        transform: scale(1.02);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-fade-in {
      animation: fade-in 0.3s ease-out;
    }

    .animate-bounce-in {
      animation: bounce-in 0.4s ease-out;
    }
  </style>

</head>

<body>
  <div id="global-error"
    style="display: none; color: red; padding: 20px; background: white; z-index: 9999; position: fixed; top: 0; left: 0; width: 100%; height: 100%;">
    <h1>Application Error</h1>
    <pre id="global-error-msg"></pre>
  </div>
  <script>
    window.onerror = function (message, source, lineno, colno, error) {
      document.getElementById('global-error').style.display = 'block';
      document.getElementById('global-error-msg').textContent = message + '\nAt: ' + source + ':' + lineno + ':' + colno;
    };
  </script>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
